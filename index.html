<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: rgba(0, 0, 0, 0.2);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --text-muted: rgba(255, 255, 255, 0.5);
      --accent: rgba(255, 255, 255, 0.9);
      --divider: rgba(255, 255, 255, 0.18);
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans SC', sans-serif;
    }

    #app {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 背景 */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://images4.alphacoders.com/108/thumb-1920-108764.jpg');
      background-size: cover;
      background-position: center;
      transform: scale(1.05);
      filter: brightness(0.72);
      z-index: 0;
    }

    /* 背景微粒子光晕 */
    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(120, 160, 255, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(200, 130, 255, 0.1) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* 毛玻璃卡片 */
    .card {
      position: relative;
      z-index: 10;
      width: min(420px, 92vw);
      padding: 3rem 2.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow:
        0 8px 32px var(--glass-shadow),
        0 2px 8px rgba(0,0,0,0.15),
        inset 0 1px 0 rgba(255,255,255,0.3);
      text-align: center;

      opacity: 0;
      transform: translateY(56px);
      transition:
        opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 子元素错落入场 */
    .card .avatar-wrap,
    .card .name,
    .card .role,
    .card .divider,
    .card .bio,
    .card .links {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card.visible .avatar-wrap { opacity: 1; transform: none; transition-delay: 0.12s; }
    .card.visible .name       { opacity: 1; transform: none; transition-delay: 0.22s; }
    .card.visible .role       { opacity: 1; transform: none; transition-delay: 0.30s; }
    .card.visible .divider    { opacity: 1; transform: none; transition-delay: 0.38s; }
    .card.visible .bio        { opacity: 1; transform: none; transition-delay: 0.46s; }
    .card.visible .links      { opacity: 1; transform: none; transition-delay: 0.56s; }

    /* 头像 */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .avatar-ring {
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.2);
      display: block;
    }

    /* 姓名 */
    .name {
      font-family: 'Noto Serif SC', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    /* 职位标签 */
    .role {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.6rem;
    }

    .role-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      display: inline-block;
    }

    /* 分隔线 */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--divider);
      margin: 0 auto 1.4rem;
    }

    /* 简介 */
    .bio {
      font-size: 0.92rem;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.85;
      margin-bottom: 2rem;
      padding: 0 0.25rem;
    }

    /* 社交链接 */
    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0.55rem 1.15rem;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition:
        background 0.25s,
        border-color 0.25s,
        color 0.25s,
        transform 0.2s;
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.5);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .link-btn svg {
      width: 15px; height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* 简介区 */
    .bio { min-height: 3.4em; }

    /* 打字光标 */
    .typed-cursor {
      display: inline-block;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 200;
      margin-left: 1px;
      animation: cur-blink 0.85s ease infinite;
    }
    @keyframes cur-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* 页脚 */
    .footer {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 1s ease 1.2s;
    }

    .footer.visible { opacity: 1; }
  </style>
</head>
<body>
<div id="app">
  <div class="bg"></div>
  <div class="bg-glow"></div>

  <div class="card" :class="{ visible: show }">
    <!-- 头像 -->
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <img
          class="avatar"
          :src="profile.avatar"
          :alt="profile.name"
          @error="handleAvatarError"
        />
      </div>
    </div>

    <!-- 姓名 -->
    <div class="name">{{ profile.name }}</div>

    <!-- 职位 -->
    <div class="role">
      <span v-for="(tag, i) in profile.tags" :key="i">
        <span class="role-dot" v-if="i > 0"></span>
        {{ tag }}
      </span>
    </div>

    <!-- 分隔 -->
    <div class="divider"></div>

    <!-- 简介 -->
    <div class="bio"><span ref="typedEl"></span><span class="typed-cursor">|</span></div>

    <!-- 链接 -->
    <div class="links">
      <a
        v-for="link in profile.links"
        :key="link.label"
        class="link-btn"
        :href="link.href"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" v-html="link.icon"></svg>
        {{ link.label }}
      </a>
    </div>
  </div>

  <div class="footer" :class="{ visible: show }">
    请输入文本
  </div>
</div>

<script>
/**
 * Typed — 内联打字机
 *
 * 修复点：
 *   - 使用 Array.from() 按 Unicode 码点切割，emoji / 特殊字符不再翻倍
 *   - 打字完成后光标持续闪烁，不隐藏
 *
 * 配置项：
 *   strings     {string[]}  要依次打出的字符串数组
 *   typeSpeed   {number}    打字间隔 ms（默认 65）
 *   deleteSpeed {number}    删除间隔 ms（默认 40）
 *   pauseAfter  {number}    打完后暂停 ms 再删除（默认 1800，loop=false 时无效）
 *   loop        {boolean}   是否循环（默认 false）
 *   onDone      {Function}  全部完成的回调
 */
class Typed {
  constructor(el, options = {}) {
    this.el          = el;
    this.strings     = options.strings     ?? [''];
    this.typeSpeed   = options.typeSpeed   ?? 65;
    this.deleteSpeed = options.deleteSpeed ?? 40;
    this.pauseAfter  = options.pauseAfter  ?? 1800;
    this.loop        = options.loop        ?? false;
    this.onDone      = options.onDone      ?? null;

    this._strIndex   = 0;
    this._charIndex  = 0;
    this._timer      = null;

    // 将当前字符串拆成码点数组，避免 emoji 被 UTF-16 截断翻倍
    this._chars      = Array.from(this.strings[0] ?? '');

    this._tick();
  }

  _tick() {
    if (this._charIndex < this._chars.length) {
      // 打字阶段
      this._charIndex++;
      this.el.textContent = this._chars.slice(0, this._charIndex).join('');
      this._timer = setTimeout(() => this._tick(), this._typeDelay());
    } else {
      // 当前字符串打完
      const isLast = this._strIndex === this.strings.length - 1;
      if (isLast && !this.loop) {
        // 不循环：保持光标闪烁，触发回调
        this.onDone?.();
        return;
      }
      // 循环：暂停后开始删除
      this._timer = setTimeout(() => this._delete(), this.pauseAfter);
    }
  }

  _delete() {
    if (this._charIndex > 0) {
      this._charIndex--;
      this.el.textContent = this._chars.slice(0, this._charIndex).join('');
      this._timer = setTimeout(() => this._delete(), this._deleteDelay());
    } else {
      // 删完，切换到下一条并重新解析码点
      this._strIndex = (this._strIndex + 1) % this.strings.length;
      this._chars    = Array.from(this.strings[this._strIndex] ?? '');
      this._timer    = setTimeout(() => this._tick(), this.typeSpeed);
    }
  }

  // 随机抖动让节奏更自然
  _typeDelay()   { return Math.max(20, this.typeSpeed   + (Math.random() - 0.5) * this.typeSpeed   * 0.4); }
  _deleteDelay() { return Math.max(15, this.deleteSpeed + (Math.random() - 0.5) * this.deleteSpeed * 0.3); }

  pause()   { clearTimeout(this._timer); }
  resume()  { this._tick(); }
  destroy() { clearTimeout(this._timer); this.el.textContent = ''; }
}

// ── Vue 应用 ──────────────────────────────────────────────
const { createApp, ref, onMounted, onUnmounted } = Vue;

createApp({
  setup() {
    const show     = ref(false);
    const typedEl  = ref(null);
    let   typedInst = null;
    const nowMs = Date.now();
    const birthdayMs = Date.parse("2012-05-30"); 

    const profile = {
      name:   'publicwy ext',
      avatar: 'https://pbs.twimg.com/profile_images/2046964968227229696/T9YDX3Ps_400x400.jpg',
      tags:   ['小孩纸', '人机', '可能会编程（？）'],
      bio:    ['你好👋', '我是一位来自北京的'+parseInt((nowMs-birthdayMs)/31556926000)+'岁小孩纸🤓', '很喜欢捣鼓电子垃圾😋', '似乎有还有很多构想没有被完成💦', '感谢您对我的网站产生了兴趣（）😋❤️'],
      links: [
        {
          label: 'GitHub',
          href:  'https://github.com/publicwyext',
          icon:  '<path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>'
        },
        {
          label: '邮箱',
          href:  'mailto:publicwy1@gmail.com',
          icon:  '<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>'
        },
      ]
    };

    const handleAvatarError = (e) => {
      e.target.src = 'https://pbs.twimg.com/profile_images/2046964968227229696/T9YDX3Ps_400x400.jpg';
    };

    onMounted(() => {
      
      setTimeout(() => {
        show.value = true;
        // bio 淡入完成后再开始打字（入场 0.08s + delay 0.46s + duration 0.6s）
        setTimeout(() => {
          typedInst = new Typed(typedEl.value, {
            strings:  profile.bio,
            typeSpeed: 65,
            loop:     false,
          });
        }, (0.08 + 0.46 + 0.6) * 1000);
      }, 80);
    });

    onUnmounted(() => typedInst?.destroy());

    return { show, profile, typedEl, handleAvatarError };
  }
}).mount('#app');
</script>
</body>
</html>
